services:
  dashboard:
    build: .
    image: iotopen-dashboard:latest
    ports:
      - "8080:8080"
    environment:
      LYNX_URL: https://lynx.iotopen.se   # your IoT Open instance (https://host, no path)
      ALLOWED_LYNX_HOSTS: lynx.iotopen.se  # comma separated allow-list for LYNX_URL
      APP_TITLE: Dashboard
      # CUSTOM_SERVERS: "false"        # hide the server choice on the sign-in page (only LYNX_URL)
      # API_MODE: direct               # browser talks to LYNX_URL itself; this container only serves the app
      # BASE_PATH: /dashboard          # only if a proxy in front forwards the path prefix unchanged
      # MAP_TILES: ""                  # map tiles for the Tracker widget (default OpenStreetMap, "" = no map background)
    restart: unless-stopped

  # Local demo without a real IoT Open instance:
  #   docker compose --profile demo up --build
  # then open http://localhost:8081  (login: demo@example.com / demo)
  mock:
    profiles: ["demo"]
    image: node:22-alpine
    working_dir: /mock
    volumes: ["./mock:/mock:ro"]
    command: ["node", "server.mjs"]
    environment:
      PORT: "8787"
  dashboard-demo:
    profiles: ["demo"]
    build: .
    ports:
      - "8081:8080"
    environment:
      LYNX_URL: http://mock:8787
      ALLOWED_LYNX_HOSTS: mock
      ALLOW_INSECURE_LYNX_URL: "true"
    depends_on: [mock]
