# Included in every location that sets its own add_header (nginx does not inherit
# add_header from the server level once a location defines one).
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
# Everything (scripts, styles, images) comes from this origin, and so do API and MQTT unless CUSTOM_SERVERS=true
# (then connect-src also allows https:/wss: for a server the user chose, see default.conf.template). The session token
# lives in browser storage, so blocking foreign scripts is the main defence against token theft.
# 'unsafe-inline' for styles only: React sets per-widget colours through style attributes.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src $dash_connect_src; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
