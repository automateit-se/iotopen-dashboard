# Installation files from /api/v2/file/download/ (see default.conf.template): a download of plain bytes that
# nothing can run in, whatever the uploader chose as type or content. Replaces the page headers for these replies.
default_type application/octet-stream;
add_header Content-Type application/octet-stream always;
add_header Content-Disposition attachment always;
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "default-src 'none'; sandbox; frame-ancestors 'none'" always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Referrer-Policy no-referrer always;
add_header Cache-Control "private, no-store" always;
