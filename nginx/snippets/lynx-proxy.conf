# Common settings for everything relayed to IoT Open. The upstream itself is fixed
# (proxy_pass ${LYNX_URL} in the template) – nothing in a request can change it.
proxy_ssl_server_name   on;
proxy_ssl_verify        on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_http_version      1.1;
proxy_set_header        Host $proxy_host;
# do not pass on client supplied forwarding headers – they can be spoofed
proxy_set_header        X-Forwarded-For $remote_addr;
proxy_set_header        X-Forwarded-Proto $scheme;
proxy_set_header        X-Forwarded-Host "";
proxy_set_header        Forwarded "";
proxy_redirect          off;
